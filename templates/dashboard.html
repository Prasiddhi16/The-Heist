{% extends 'index.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<style>
  @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=Nosifer&display=swap');

  @keyframes pulseGlow {
    0%, 100% { box-shadow: inset 0 0 50px #000, 0 0 25px rgba(255, 0, 0, 0.4); }
    50% { box-shadow: inset 0 0 70px #300, 0 0 45px rgba(255, 0, 0, 0.8); }
  }

  .murder-wrapper {
    position: relative;
    padding: 60px 65px;
    background: #040202;
    background-image: 
      radial-gradient(ellipse 35px 50px at 85% 22%, transparent 0%, rgba(180,0,0,0.5) 5%, transparent 10%, rgba(180,0,0,0.6) 15%, transparent 20%),
      radial-gradient(ellipse 30px 45px at 15% 78%, transparent 0%, rgba(160,0,0,0.5) 4%, transparent 8%, rgba(160,0,0,0.6) 12%, transparent 16%),
      radial-gradient(circle at 50% 50%, rgba(120, 0, 0, 0.3) 0%, transparent 50%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.4) 0px, rgba(0,0,0,0.4) 2px, transparent 2px, transparent 4px);
    border-radius: 4px;
    animation: flickering 6.5s infinite, pulseGlow 3s infinite alternate;
    overflow: hidden;
  }

  .murder-wrapper::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 40px;
    background-color: #0b0706;
    background-image: radial-gradient(#261715 35%, #000 45%, transparent 46%);
    background-size: 28px 20px;
    background-position: 8px center;
    border-bottom: 3px solid #800000;
    box-shadow: 0 5px 15px rgba(0,0,0,0.9);
    z-index: 10;
  }

  .murder-wrapper::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40px;
    background-color: #0b0706;
    background-image: radial-gradient(#261715 35%, #000 45%, transparent 46%);
    background-size: 28px 20px;
    background-position: 8px center;
    border-top: 3px solid #800000;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.9);
    z-index: 10;
  }

  .reel-side-left,
  .reel-side-right {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 40px;
    background-color: #0b0706;
    background-image: radial-gradient(#261715 35%, #000 45%, transparent 46%);
    background-size: 20px 28px;
    background-position: center 8px;
    z-index: 11;
  }
  .reel-side-left {
    left: 0;
    border-right: 3px solid #800000;
    box-shadow: 5px 0 15px rgba(0,0,0,0.9);
  }
  .reel-side-right {
    right: 0;
    border-left: 3px solid #800000;
    box-shadow: -5px 0 15px rgba(0,0,0,0.9);
  }

  .blood-drips {
    position: absolute;
    top: 40px;
    left: 40px;
    right: 40px;
    height: 12px;
    background: linear-gradient(180deg, #800000 0%, transparent 100%);
    opacity: 0.7;
    z-index: 9;
  }

  .page-hdr { 
    position: relative;
    border-left: 5px solid #ff0000; 
    padding: 15px 0 15px 20px; 
    margin-bottom: 30px; 
    background: linear-gradient(90deg, rgba(180,0,0,0.35) 0%, transparent 100%);
    box-shadow: inset 10px 0 20px rgba(255, 0, 0, 0.2);
  }

  .page-title {
    font-family: 'Nosifer', cursive;
    font-size: 2.2rem;
    letter-spacing: 2px;
    color: black;
    text-shadow: 0 0 12px rgba(255, 0, 0, 0.9), 3px 3px 6px #000;
    margin: 0;
    line-height: 1.2;
  }

  .page-sub { 
    color: #cca485; 
    font-family: 'Special Elite', cursive; 
    font-style: italic; 
    font-size: 1rem;
    margin-top: 8px;
    text-shadow: 0 0 4px #000;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 35px;
    z-index: 8;
    position: relative;
  }

  .stat-card {
    background: #080404;
    border: 2px solid #660000;
    padding: 20px;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(139, 0, 0, 0.4), inset 0 0 20px #000;
    text-align: center;
  }

  .stat-label {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 0.85rem;
    color: #cca485;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .stat-val {
    font-family: 'Nosifer', cursive;
    font-size: 1.6rem;
    color: #ff3333;
    margin-top: 10px;
    text-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
  }

  .card {
    position: relative;
    background: #080404;
    background-image: 
      radial-gradient(ellipse 38px 55px at 10% 88%, transparent 0%, rgba(200,0,0,0.25) 5%, transparent 10%, rgba(200,0,0,0.3) 15%, transparent 20%),
      radial-gradient(ellipse at bottom left, rgba(180,0,0,0.25) 0%, transparent 70%),
      radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 3px 3px;
    border: 2px solid #660000;
    box-shadow: 0 0 30px rgba(139, 0, 0, 0.5), inset 0 0 30px #000;
    z-index: 8;
    overflow-x: auto;
  }

  .data-table { width: 100%; border-collapse: collapse; }
  .data-table th {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 0.95rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ff3333;
    border-bottom: 2px solid #800000;
    padding: 14px;
    text-align: left;
    background: rgba(30, 0, 0, 0.9);
    text-shadow: 0 0 5px rgba(255,0,0,0.5);
  }
  .data-table td {
    padding: 16px 14px;
    border-bottom: 1px solid #3d0c0c;
    color: #e6d3be;
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 0.95rem;
  }
  .data-table tr:hover td { 
    background: rgba(220, 0, 0, 0.25); 
    box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.3);
  }

  .btn-dash-action {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 2px;
    border: 1px solid #ff0000;
    background: rgba(40,0,0,0.9);
    color: #ff6b6b;
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 0.85rem;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.2s ease;
    box-shadow: 0 0 8px rgba(255,0,0,0.4);
    margin-right: 6px;
  }
  .btn-dash-action:hover {
    background: #e60000;
    color: #fff;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.9);
  }

  .btn-suspects-highlight {
    border-color: #ff3333;
    background: linear-gradient(180deg, #800000 0%, #300000 100%);
    color: #ffffff;
  }
  .btn-suspects-highlight:hover {
    background: #b30000;
  }

  .stamp-empty {
    text-align: center;
    padding: 40px;
    color: #ff0000;
    font-family: 'Nosifer', cursive;
    font-size: 1.1rem;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255,0,0,0.8);
  }
</style>

<div class="murder-wrapper">
  <div class="reel-side-left"></div>
  <div class="reel-side-right"></div>
  <div class="blood-drips"></div>

  <div class="page-hdr">
    <h1 class="page-title">INVESTIGATOR DOSSIER</h1>
    <div class="page-sub">Active Case Console & Performance Tracker</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">OPERATIVE</div>
      <div class="stat-val" id="dash-username">...</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">RANK</div>
      <div class="stat-val" id="dash-rank">...</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">CASES SOLVED</div>
      <div class="stat-val" id="dash-solved">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">SCORE</div>
      <div class="stat-val" id="dash-score">0</div>
    </div>
  </div>

  <div class="card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Case ID</th>
          <th>Case Number</th>
          <th>Title</th>
          <th>Location</th>
          <th>Status</th>
          <th>Case Actions</th>
        </tr>
      </thead>
      <tbody id="dash-cases-body">
        <tr>
          <td colspan="6" class="stamp-empty">SCANNING CASE FILES...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function () {
  if (!window.supabaseClient) {
    console.error('Supabase client is missing.');
    return;
  }

  //Fetching current logged-in Supabase user
  const { data: authData, error: authError } = await window.supabaseClient.auth.getUser();

  if (authError || !authData?.user) {
    console.warn('User is unauthenticated.');
    document.getElementById('dash-username').textContent = 'UNAUTHORIZED';
    return;
  }

  const userId = authData.user.id;

  // Querying user data from users table
  const { data: profile, error: profileError } = await window.supabaseClient
    .from('users')
    .select('*')
    .eq('user_id', userId)
    .single();

  if (profileError) {
    console.error('Profile fetch error:', profileError);
  } else if (profile) {
    document.getElementById('dash-username').textContent = profile.username || 'Agent';
    document.getElementById('dash-rank').textContent = profile.rank || 'Rookie';
    document.getElementById('dash-solved').textContent = profile.cases_solved || 0;
    document.getElementById('dash-score').textContent = profile.score || 0;
  }

  //Retrieving all active cases from cases table
  const { data: cases, error: casesError } = await window.supabaseClient
    .from('cases')
    .select('*')
    .order('case_id', { ascending: true });

  const tbody = document.getElementById('dash-cases-body');

  if (casesError) {
    console.error('Cases fetch error:', casesError);
    tbody.innerHTML = '<tr><td colspan="6" class="stamp-empty">ERROR LOADING FILES</td></tr>';
    return;
  }

  if (!cases || cases.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="stamp-empty">NO ACTIVE CASES ASSIGNED</td></tr>';
    return;
  }

  tbody.innerHTML = cases.map(function (c) {
    return `
      <tr>
        <td>#${c.case_id}</td>
        <td><strong>${c.case_number}</strong></td>
        <td>${c.title}</td>
        <td>${c.location || 'Unknown'}</td>
        <td><span style="color:#ff4d4d;">${c.status || 'Active'}</span></td>
        <td>
          <a href="/case/${c.case_id}/evidence/" class="btn-dash-action">View Evidence</a>
          <a href="/case/${c.case_id}/suspects/" class="btn-dash-action btn-suspects-highlight">Inspect Suspects</a>
        </td>
      </tr>
    `;
  }).join('');
});
</script>

{% endblock %}
