{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heist Solver — Detective Intelligence System</title>
    <link rel="stylesheet" href="{% static 'styles/root.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Utility fallback styles */
        .hidden { display: none !important; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; }
    </style>
</head>

<body>

<div id="screen-login">
    <!-- Left art section -->
    <div class="login-art">
        <div class="login-art-svg">
            <!-- Left badge logo -->
            <div class="badge-logo-container">
                <i class="fa-solid fa-shield-cat"></i>
            </div>
        </div>

        <div class="login-art-text">
            <h2>Heist Solver</h2>
            <p>Detective Intelligence System</p>
        </div>
    </div>

    <!-- Right form panel -->
    <div class="login-form-panel">

        <div class="lf-logo">
            <!-- Right logo icon box updated -->
            <div class="lf-logo-icon">
                <i class="fa-solid fa-shield-cat"></i>
            </div>

            <div>
                <div class="lf-logo-text">Heist Solver</div>
                <div class="lf-logo-sub">Detective Intelligence System</div>
            </div>
        </div>

        <!-- Navigation tab switches -->
        <div class="tab-switch">
            <button class="tab-btn active" id="ltab-in" onclick="switchLoginTab('in')">
                Sign In
            </button>

            <button class="tab-btn" id="ltab-up" onclick="switchLoginTab('up')">
                Register
            </button>
        </div>

        <!-- Error reporting zone -->
        <div id="auth-error" class="error-msg hidden"></div>

        <!-- Registration extra fields -->
        <div id="reg-fields" class="hidden">
            <div class="rf">
                <label class="flabel">Full Name</label>
                <input class="finput"
                       placeholder="e.g. Write your name here"
                       id="reg-name">
            </div>
        </div>

        <!-- Username field -->
        <div class="rf">
            <label class="flabel">Username</label>
            <input class="finput"
                   placeholder="Enter your detective handle"
                   id="inp-user"
                   value="">
        </div>

        <!-- Password input container -->
        <div class="rf">
            <label class="flabel">Password</label>
            <div class="pass-wrapper">
                <input class="finput"
                       type="password"
                       placeholder="Enter password (min 8 chars)"
                       id="inp-pass"
                       value="">
                <!-- Persistent eye icon -->
                <i class="fa-solid fa-eye pass-eye-btn" id="toggle-pass-btn" onclick="togglePasswordVisibility()"></i>
            </div>
        </div>

        <!-- Form submit button -->
        <button class="submit-btn"
                id="login-btn"
                onclick="handleSubmit(event)">
            Access Intelligence System
        </button>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Supabase global configs
  window.SUPABASE_URL = "{{ supabase_url }}";
  window.SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";
</script>

<script src="{% static 'js/supabase-client.js' %}"></script>
<script>

// Current auth mode
let loginMode = "in";

// Show error messages
function showError(msg) {
    const errBox = document.getElementById("auth-error");
    if (msg) {
        errBox.textContent = msg;
        errBox.classList.remove("hidden");
    } else {
        errBox.classList.add("hidden");
    }
}

// Toggle password view
function togglePasswordVisibility() {
    const passInput = document.getElementById("inp-pass");
    const toggleBtn = document.getElementById("toggle-pass-btn");
    
    if (passInput.type === "password") {
        passInput.type = "text";
        toggleBtn.classList.remove("fa-eye");
        toggleBtn.classList.add("fa-eye-slash");
    } else {
        passInput.type = "password";
        toggleBtn.classList.remove("fa-eye-slash");
        toggleBtn.classList.add("fa-eye");
    }
}

// Switch auth tabs
function switchLoginTab(mode) {
    loginMode = mode;
    showError(""); // Clear status alerts

    document.getElementById("ltab-in").classList.toggle("active", mode === "in");
    document.getElementById("ltab-up").classList.toggle("active", mode === "up");
    document.getElementById("reg-fields").classList.toggle("hidden", mode === "in");

    const passInput = document.getElementById("inp-pass");
    if (mode === "up") {
        passInput.placeholder = "Create password (min 8 chars)";
    } else {
        passInput.placeholder = "Enter your password";
    }

    document.getElementById("login-btn").textContent =
        mode === "in"
            ? "Access Intelligence System"
            : "Create Account";
}

// Handle submit action
async function handleSubmit(event) {
    event.preventDefault(); 
    showError("");
    
    // Check client state
    if (!window.supabaseClient) {
        showError("Supabase initialization failed. Verify client connection settings.");
        return;
    }

    const username = document.getElementById("inp-user").value.trim().toLowerCase();
    const password = document.getElementById("inp-pass").value;
    const fullName = document.getElementById("reg-name").value.trim();

    // Validate empty credentials
    if (!username || !password) {
        showError("Username and password credentials are required.");
        return;
    }

    // Check registration password
    if (loginMode === "up") {
        if (password.length < 8) {
            showError("Password must be at least 8 characters long.");
            return;
        }
    }

    // Create pseudo email
    const pseudoEmail = `${username}@heistsolver.com`;
    const btn = document.getElementById("login-btn");
    
    btn.disabled = true;
    btn.textContent = loginMode === "in" ? "Verifying Credentials..." : "Creating Dossier...";

    try {
        if (loginMode === "in") {
            // User login operation
            const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                email: pseudoEmail,
                password: password,
            });

            // Display standard error
            if (error) {
                throw new Error("Invalid username or password.");
            }

            localStorage.setItem("loggedInUser", username);
            window.location.href = "{% url 'dashboard' %}";

        } else {
            // User registration operation
            if (!fullName) {
                showError("Please enter your full name to generate a target profile.");
                btn.disabled = false;
                btn.textContent = "Create Account";
                return;
            }

            // Create new account
            const { data, error: signUpError } = await window.supabaseClient.auth.signUp({
                email: pseudoEmail,
                password: password,
            });

            if (signUpError) {
                if (signUpError.message.includes("already registered")) {
                    throw new Error("Username is already taken.");
                }
                throw signUpError;
            }
            if (!data.user) throw new Error("Authentication interface failed to provision identity.");

            // Insert user profile
            const { error: profileError } = await window.supabaseClient
                .from('users')
                .insert([
                    {
                        user_id: data.user.id,
                        username: username,
                        full_name: fullName,
                        rank: 'Rookie',
                        cases_solved: 0,
                        score: 0
                    }
                ]);

            if (profileError) {
                console.error("Profile binding tracking failed:", profileError);
            }

            localStorage.setItem("loggedInUser", username);
            alert("Account created successfully! Welcome to the agency.");
            window.location.href = "{% url 'dashboard' %}";
        }
    } catch (err) {
        showError(err.message || "An unexpected system anomaly has occurred.");
        btn.disabled = false;
        btn.textContent = loginMode === "in" ? "Access Intelligence System" : "Create Account";
    }
}

// Global key bindings
document.addEventListener("DOMContentLoaded", () => {
    const pass = document.getElementById("inp-pass");
    const user = document.getElementById("inp-user");

    if (pass) {
        pass.addEventListener("keydown", e => {
            if (e.key === "Enter") handleSubmit(e);
        });
    }

    if (user) {
        user.addEventListener("keydown", e => {
            if (e.key === "Enter") pass.focus();
        });
    }
});

</script>

</body>
</html>
